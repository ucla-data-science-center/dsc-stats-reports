project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - capability.qmd
    - about.qmd
    - consulting.qmd
    - instruction.qmd
    - infrastructure.qmd
    - metrics-governance.md
    - dsc-retrospective-2017-2026.qmd
    - style-preview.qmd   # not in the navbar; font options for Tim
    # dsc_report2024.qmd excluded from nav; render separately if needed

execute:
  freeze: false

website:
  title: "DSC Statistics"
  description: "UCLA Library Data Science Center — service metrics and infrastructure reporting."
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - text: "Pathways"
        menu:
          - href: capability.qmd
            text: Research capability built
      - text: "Evidence"
        menu:
          - href: consulting.qmd
            text: Consulting
          - href: instruction.qmd
            text: Instruction
          - href: infrastructure.qmd
            text: Infrastructure
      - href: about.qmd
        text: About
      - href: https://ucla-data-science-center.github.io/ssda-dsc-history/history.html
        text: DSC History
    right:
      - icon: github
        href: https://github.com/ucla-data-science-center/dsc-stats-reports
        aria-label: GitHub repository
  page-footer:
    left: "UCLA Library Data Science Center"
    right: "Data baked in at render. [About & methodology](about.qmd)."

format:
  html:
    theme:
      light: [flatly, ucla-light.scss]
      dark: [darkly, ucla-dark.scss]
    css: styles.css
    include-in-header: _head.html
    smooth-scroll: true
    toc: true
    toc-depth: 2