# Theme profiles: `dsc` (DSC's 2019 identity colors) or `ucla-tints` (UCLA
# secondary palette). Switch the whole site by changing `default` below; preview
# the other one with `pixi run render --profile ucla-tints`.
profile:
  default: dsc
  group:
    - [dsc, ucla-tints]

project:
  type: website
  output-dir: docs
  resources:
    - images/brand/**   # logo and identity elements (some referenced only from CSS)
  render:
    - index.qmd
    - capability.qmd
    - research.qmd
    - investments.qmd
    - about.qmd
    - consulting.qmd
    - instruction.qmd
    - infrastructure.qmd
    - metrics-governance.md
    - dsc-retrospective-2017-2026.qmd
    # dsc_report2024.qmd excluded from nav; render separately if needed

execute:
  freeze: false

website:
  title: "Research Enabled by DSC"
  favicon: images/brand/dsc-cube.svg
  description: "What the UCLA Library Data Science Center contributes to research at UCLA, and the evidence behind each figure."
  navbar:
    background: primary
    # DSC logo from the 2019 identity package (white version; the bar is blue in both themes)
    logo: images/brand/dsc-logo-white.svg
    logo-alt: "UCLA Library Data Science Center"
    title: "Research Enabled by DSC"
    left:
      - href: index.qmd
        text: Home
      - text: "Pathways"
        menu:
          - href: research.qmd
            text: Research enabled
          - href: capability.qmd
            text: Research capability built
          - href: investments.qmd
            text: Shared investments
      - text: "Evidence"
        menu:
          - href: consulting.qmd
            text: Consulting
          - href: instruction.qmd
            text: Instruction
          - href: infrastructure.qmd
            text: Infrastructure
      - href: about.qmd
        text: About
      - href: https://ucla-data-science-center.github.io/ssda-dsc-history/history.html
        text: History
    right:
      - icon: github
        href: https://github.com/ucla-data-science-center/dsc-stats-reports
        aria-label: GitHub repository
  # "Edit this page", "View source", and "Report an issue" links on every page
  repo-url: https://github.com/ucla-data-science-center/dsc-stats-reports
  repo-branch: main
  repo-actions: [edit, source, issue]
  # Shared footer; the history site carries the same link groups
  page-footer:
    left: |
      [Read further]{.footer-heading}

      [Research Enabled by DSC](https://ucla-data-science-center.github.io/dsc-stats-reports/)\
      [History of the archive since 1961](https://ucla-data-science-center.github.io/ssda-dsc-history/history.html)\
      [How figures are counted](https://ucla-data-science-center.github.io/dsc-stats-reports/about.html)
    center: |
      [Related]{.footer-heading}

      [UCLA Dataverse](https://dataverse.ucla.edu/)\
      [DataSquad student projects](https://ucla-datasquad.github.io/)\
      [Data Science Center at UCLA Library](https://www.library.ucla.edu/visit/locations/data-science-center/)
    right: |
      [Get in touch]{.footer-heading}

      [Request a research consultation](https://uclalibrary.atlassian.net/servicedesk/customer/portal/5)\
      [Report a correction](https://github.com/ucla-data-science-center/dsc-stats-reports/issues/new?template=correction.yml)

format:
  html:
    css: styles.css
    include-in-header: _head.html
    include-after-body: _brand-strip.html
    smooth-scroll: true
    toc: true
    toc-depth: 2