project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - about.qmd
    - consulting.qmd
    - instruction.qmd
    - infrastructure.qmd
    - metrics-governance.md
    # dsc_report2024.qmd excluded from nav; render separately if needed

execute:
  freeze: false

website:
  title: "DSC Statistics"
  description: "UCLA Library Data Science Center — service metrics and infrastructure reporting."
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - text: "Statistics"
        menu:
          - href: consulting.qmd
            text: Consulting
          - href: instruction.qmd
            text: Instruction
          - href: infrastructure.qmd
            text: Infrastructure
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/ucla-data-science-center/dsc-stats-reports
        aria-label: GitHub repository
  page-footer:
    left: "UCLA Library Data Science Center"
    right: "Data baked in at render. [About & methodology](about.qmd)."

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    smooth-scroll: true
    toc: true
    toc-depth: 2